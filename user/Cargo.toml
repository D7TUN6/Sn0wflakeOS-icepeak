[package]
name = "icepeak-user"
version = "0.1.0"
edition = "2024"

[lib]
name = "icepeak_user"
path = "src/lib.rs"

[dependencies]
abi = { path = "../abi" }

[[bin]]
name = "hello"
path = "src/bin/hello.rs"

[profile.dev]
opt-level = 0
debug = true
lto = false
codegen-units = 256
panic = "abort"
overflow-checks = true

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
debug = false
