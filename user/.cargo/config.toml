[build]
target = "x86_64-unknown-linux-gnu"

[target.x86_64-unknown-linux-gnu]
rustflags = [
    "-C", "panic=abort",
    "-C", "code-model=large",
    "-C", "relocation-model=static",
    "-C", "link-arg=-nostartfiles",
    "-C", "link-arg=-nostdlib",
    "-C", "link-arg=-static",
    "-C", "link-arg=-no-pie",
    "-C", "link-arg=-Wl,-T,linker.ld",
    "-C", "link-arg=-Wl,--build-id=none",
    "-C", "link-arg=-Wl,-z,norelro",
]
